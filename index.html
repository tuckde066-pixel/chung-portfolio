<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAEUN CHUNG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DAEUN CHUNG — Portfolio
   Reference-matched: pure white, black ink, thin gray hairlines
   Typeface: Inter (display/UI) + Pretendard (Korean)
   ============================================================ */

:root {
  --bg: #ffffff;
  --bg-panel: #f5f5f5;
  --ink: #111111;
  --muted: #8a8a8a;
  --line: #e6e6e6;
  --accent: #111111;
  --accent-soft: #d9d9d9;
  --sidebar-w: 300px;
  --gutter: clamp(24px, 5vw, 72px);
  --sans: 'Inter', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  --serif: 'Inter', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

::selection { background: var(--accent-soft); color: var(--ink); }

:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}

/* ---------------- Sidebar ---------------- */

.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  padding: 40px 32px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid var(--line);
  background: var(--bg);
  z-index: 10;
}

.name {
  font-family: var(--sans);
  font-weight: 800;
  font-size: 30px;
  line-height: 1.12;
  letter-spacing: -0.02em;
  margin: 0 0 14px;
  text-transform: uppercase;
}

.tagline {
  font-family: var(--sans);
  font-style: normal;
  font-weight: 400;
  font-size: 13px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0 0 18px;
}

.location {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.nav-group {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.nav-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2px;
}

.nav-link {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--ink);
  position: relative;
  width: fit-content;
}

.nav-link--flat {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 15px;
}

.nav-link::after {
  content: "";
  position: absolute;
  left: 0; bottom: -3px;
  width: 0%;
  height: 1px;
  background: var(--ink);
  transition: width 0.2s ease;
}

.nav-link:hover::after,
.nav-link:focus-visible::after,
.nav-link.is-active::after {
  width: 100%;
}

.sidebar-note {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}

/* ---------------- Nav toggle (mobile) ---------------- */

.nav-toggle {
  display: none;
  position: fixed;
  top: 18px; right: 18px;
  z-index: 20;
  width: 40px; height: 40px;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 50%;
  cursor: pointer;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.nav-toggle span {
  width: 16px; height: 1px;
  background: var(--ink);
  display: block;
}

/* ---------------- Main content ---------------- */

.main {
  margin-left: var(--sidebar-w);
  padding: 0 var(--gutter) 120px;
}

.series {
  padding-top: 88px;
  max-width: 980px;
}

.series-header {
  display: flex;
  gap: 20px;
  margin-bottom: 44px;
}

.series-header h2 {
  font-family: var(--sans);
  font-weight: 800;
  font-size: 28px;
  margin: 0 0 2px;
  letter-spacing: -0.01em;
}

.work {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0 auto 96px;
  max-width: 720px;
}

.work-image {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: var(--bg-panel);
  border: 1px solid var(--line);
}

.work-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.work-image::after {
  content: attr(data-caption);
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--muted);
  font-family: var(--sans);
  letter-spacing: 0.02em;
}

.placeholder-texture {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(90deg, rgba(17,17,17,0.04) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(0deg, rgba(17,17,17,0.04) 0 1px, transparent 1px 6px),
    linear-gradient(160deg, #f2f2f2, #e8e8e8);
}

.work-meta {
  padding-top: 18px;
  text-align: center;
}

.work-meta h3 {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 19px;
  margin: 0 0 6px;
}

.work-sub {
  font-size: 12.5px;
  color: var(--muted);
  margin: 0;
}

/* ---------------- Text sections ---------------- */

.text-section {
  padding-top: 88px;
  max-width: 680px;
  border-top: 1px solid var(--line);
}

.text-header {
  display: flex;
  gap: 20px;
  align-items: baseline;
  margin-bottom: 28px;
}

.text-header h2 {
  font-family: var(--sans);
  font-weight: 800;
  font-size: 24px;
  margin: 0;
}

.list {
  list-style: none;
  margin: 0 0 32px;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.list li {
  display: grid;
  grid-template-columns: 70px 1fr;
  gap: 16px;
  font-size: 14px;
  line-height: 1.6;
  border-bottom: 1px dashed var(--line);
  padding-bottom: 14px;
}

.list-year {
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 600;
}

.list--placeholder .list-body,
.list--placeholder .list-year {
  color: var(--muted);
  font-weight: 400;
}

.cv-block { margin-bottom: 12px; }

.cv-block h3 {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 700;
  margin: 0 0 14px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.text-section--contact {
  padding-bottom: 20px;
}

.contact-line {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 17px;
  margin: 0 0 8px;
}

.footer {
  margin-left: 0;
  padding-top: 60px;
  font-size: 12px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  margin-top: 60px;
  max-width: 680px;
}

/* ---------------- Responsive ---------------- */

@media (max-width: 720px) {
  .nav-toggle { display: flex; }

  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    width: min(320px, 84vw);
    box-shadow: 2px 0 24px rgba(0,0,0,0.08);
  }

  .sidebar.is-open {
    transform: translateX(0);
  }

  .main {
    margin-left: 0;
    padding: 100px 20px 100px;
  }

  .series-header {
    flex-direction: column;
    gap: 8px;
  }
}

</style>
</head>
<body>

<button class="nav-toggle" id="navToggle" aria-label="메뉴 열기" aria-expanded="false">
  <span></span><span></span><span></span>
</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <h1 class="name" id="siteName"></h1>
    <p class="tagline" id="siteTagline"></p>
    <p class="location" id="siteLocation"></p>
  </div>

  <nav class="nav">
    <div class="nav-group" id="navWorksGroup">
      <span class="nav-label">Works</span>
      <!-- 연도 링크가 여기 자동으로 채워집니다 -->
    </div>
    <div class="nav-group">
      <a href="#exhibitions" class="nav-link nav-link--flat">Exhibitions</a>
      <a href="#cv" class="nav-link nav-link--flat">CV</a>
      <a href="#contact" class="nav-link nav-link--flat">Contact</a>
    </div>
  </nav>

  <div class="sidebar-bottom">
    <p class="sidebar-note" id="siteSidebarNote"></p>
  </div>
</aside>

<main class="main" id="top">

  <div id="worksContainer"></div>

  <!-- ===================== EXHIBITIONS ===================== -->
  <section class="text-section" id="exhibitions">
    <header class="text-header">
      <h2>Exhibitions</h2>
    </header>
    <ul class="list" id="exhibitionsList"></ul>
  </section>

  <!-- ===================== CV ===================== -->
  <section class="text-section" id="cv">
    <header class="text-header">
      <h2>CV</h2>
    </header>

    <div class="cv-block">
      <h3>Education</h3>
      <ul class="list" id="cvEducationList"></ul>
    </div>

    <div class="cv-block">
      <h3>Experience</h3>
      <ul class="list" id="cvExperienceList"></ul>
    </div>
  </section>

  <!-- ===================== CONTACT ===================== -->
  <section class="text-section text-section--contact" id="contact">
    <header class="text-header">
      <h2>Contact</h2>
    </header>
    <p class="contact-line" id="contactEmail"></p>
    <p class="contact-line" id="contactInstagram"></p>
  </section>

  <footer class="footer">
    <p>© 2026 Daeun Chung</p>
  </footer>

</main>

<!-- ============================================================
     Supabase 설정 — 아래 두 값만 채워 넣으면 됩니다.
     ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bdmeqpouogodgaoltkmh.supabase.co";
const SUPABASE_KEY = "sb_publishable_sTlAlp82aYGJyxEJTG5HDw_Gze1ax6B";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function el(tag, opts) {
  var e = document.createElement(tag);
  opts = opts || {};
  if (opts.class) e.className = opts.class;
  if (opts.html !== undefined) e.innerHTML = opts.html;
  if (opts.text !== undefined) e.textContent = opts.text;
  if (opts.attrs) for (var k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
  return e;
}

function renderList(containerId, items) {
  var ul = document.getElementById(containerId);
  (items || []).forEach(function (item) {
    var li = el('li', { class: item.placeholder ? 'list--placeholder' : '' });
    li.appendChild(el('span', { class: 'list-year', text: item.year || '' }));
    li.appendChild(el('span', { class: 'list-body', text: item.body || '' }));
    ul.appendChild(li);
  });
}

async function loadSite() {
  const [{ data: siteRow, error: siteErr }, { data: works, error: workErr }] = await Promise.all([
    sb.from('site_content').select('data').eq('id', 1).single(),
    sb.from('works').select('*').order('year', { ascending: false }).order('sort_order', { ascending: true })
  ]);

  if (siteErr || workErr) {
    console.error(siteErr || workErr);
    document.getElementById('worksContainer').textContent = '콘텐츠를 불러오지 못했습니다.';
    return;
  }

  const data = siteRow.data || {};

  // ---- sidebar identity ----
  document.getElementById('siteName').innerHTML =
    (data.nameLine1 || '') + '<br>' + (data.nameLine2 || '');
  document.getElementById('siteTagline').textContent = data.tagline || '';
  document.getElementById('siteLocation').textContent = data.location || '';
  document.getElementById('siteSidebarNote').innerHTML =
    (data.sidebarNote || '').split('\n').join('<br>');

  // ---- group works by year (already sorted desc from query) ----
  var yearMap = [];
  (works || []).forEach(function (w) {
    var group = yearMap.find(function (g) { return g.year === w.year; });
    if (!group) { group = { year: w.year, works: [] }; yearMap.push(group); }
    group.works.push(w);
  });

  // ---- nav: year links ----
  var navGroup = document.getElementById('navWorksGroup');
  yearMap.forEach(function (y) {
    var a = el('a', {
      class: 'nav-link nav-link--flat',
      text: y.year,
      attrs: { href: '#year-' + y.year }
    });
    navGroup.appendChild(a);
  });

  // ---- works sections ----
  var worksContainer = document.getElementById('worksContainer');
  yearMap.forEach(function (y) {
    var section = el('section', { class: 'series', attrs: { id: 'year-' + y.year } });
    var header = el('header', { class: 'series-header' });
    header.appendChild(el('div', { html: '<h2>' + y.year + '</h2>' }));
    section.appendChild(header);

    y.works.forEach(function (w) {
      var work = el('div', { class: 'work' });
      var img = el('div', { class: 'work-image' });
      if (w.image_url) {
        img.appendChild(el('img', { attrs: { src: w.image_url, alt: w.title || '', loading: 'lazy', decoding: 'async' } }));
      } else {
        img.setAttribute('data-caption', '이미지를 준비 중입니다');
        img.appendChild(el('div', { class: 'placeholder-texture' }));
      }
      work.appendChild(img);

      var meta = el('div', { class: 'work-meta' });
      meta.appendChild(el('h3', { text: w.title || 'Untitled' }));
      meta.appendChild(el('p', { class: 'work-sub', text: w.sub || '' }));
      work.appendChild(meta);

      section.appendChild(work);
    });

    worksContainer.appendChild(section);
  });

  // ---- exhibitions / cv ----
  renderList('exhibitionsList', data.exhibitions);
  renderList('cvEducationList', data.cvEducation);
  renderList('cvExperienceList', data.cvExperience);

  // ---- contact ----
  document.getElementById('contactEmail').textContent = data.contactEmail || '';
  document.getElementById('contactInstagram').textContent = data.contactInstagram || '';
}

loadSite();

// Mobile sidebar toggle
const toggle = document.getElementById('navToggle');
const sidebar = document.getElementById('sidebar');

if (toggle && sidebar) {
  toggle.addEventListener('click', () => {
    const isOpen = sidebar.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(isOpen));
  });

  sidebar.addEventListener('click', (e) => {
    if (e.target.closest('a')) {
      sidebar.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });
}

// Highlight active nav link based on scroll position
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const id = entry.target.getAttribute('id');
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('is-active', link.getAttribute('href') === `#${id}`);
      });
    }
  });
}, { rootMargin: '-40% 0px -50% 0px', threshold: 0 });

// Observe sections once they exist (after loadSite renders them)
setTimeout(() => {
  document.querySelectorAll('section[id]').forEach(section => observer.observe(section));
}, 500);
</script>
</body>
</html>
